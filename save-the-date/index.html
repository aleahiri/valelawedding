<style>
  :root {
    --ivory: #fbf8f2;
    --cream: #f3ece0;
    --gold: #b08d57;
    --gold-soft: #d8c39c;
    --ink: #7f6448;        /* EDIT: main text color (champagne brown) */
    --muted: #8c7a66;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Montserrat', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-gutter: stable; }
  body { background: var(--ivory); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.7; }
  a { color: inherit; }

  /* ---------- Save the date ---------- */
  .hero {
    min-height: 100vh; min-height: 100svh; display: grid; place-items: center; text-align: center;
    padding: 3.2rem 1.5rem; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse at top, rgba(216,195,156,.35), transparent 60%),
      var(--ivory);
  }
  /* thin double frame around the page, like the cards on the main site */
  /* page trim: the same double gold frame and corner flourishes as the card */
  .frame { position: absolute; inset: 18px; border: 1px solid rgba(176,141,87,.55); pointer-events: none; }
  .frame::after { content: ""; position: absolute; inset: 8px; border: .5px solid rgba(176,141,87,.35); }
  .frame .corner { position: absolute; width: 92px; height: 92px; color: var(--gold); }
  .frame .corner.tl { left: -8px; top: -8px; }
  .frame .corner.tr { right: -8px; top: -8px; transform: scaleX(-1); }
  .frame .corner.bl { left: -8px; bottom: -8px; transform: scaleY(-1); }
  .frame .corner.br { right: -8px; bottom: -8px; transform: scale(-1, -1); }
  /* gentle gold shine that sweeps across the lettering every 10 seconds */
  .hero h1, .hero h1 em, .hero .date, .hero .eyebrow {
    --c: var(--ink);
    background: linear-gradient(105deg, var(--c) 40%, #f3e2bb 49%, #fff7e2 50%, #f3e2bb 51%, var(--c) 60%) 85% 0 / 300% 100% no-repeat;
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    animation: textShine 10s ease-in-out 2.5s infinite;   /* EDIT: 10s = time between shines */
  }
  .hero h1 em, .hero .eyebrow { --c: var(--gold); }
  .hero .eyebrow { animation-delay: 2.3s; }
  .hero .date { animation-delay: 2.75s; }
  @keyframes textShine { 0% { background-position: 85% 0; } 16%, 100% { background-position: 15% 0; } }
  @media (prefers-reduced-motion: reduce) { .hero h1, .hero h1 em, .hero .date, .hero .eyebrow { animation: none; } }

  /* page embellishments */
  .hero { background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .37 0 0 0 0 .25 0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      radial-gradient(ellipse at top, rgba(216,195,156,.35), transparent 60%),
      var(--ivory); }
  .frame .edge { position: absolute; left: 50%; width: 120px; height: 30px; margin-left: -60px; color: var(--gold); }
  .frame .edge.top { top: 12px; }
  .frame .edge.bottom { bottom: 12px; transform: scaleY(-1); }
  .frame .edge::before { content: ""; }
  .page-flowers { position: absolute; width: 300px; height: 150px; pointer-events: none; z-index: 0;
    filter: drop-shadow(0 2px 2px rgba(90,65,35,.16)); opacity: .95; }
  .page-flowers.tl { left: 46px; top: 74px; transform: rotate(48deg); transform-origin: 50% 66%; }
  .page-flowers.br { right: 46px; bottom: 74px; transform: rotate(228deg); transform-origin: 50% 66%; }
  .hero > div:not(.frame) { position: relative; z-index: 1; }
  .page-crest { display: block; width: 104px; height: 56px; margin: 0 auto .7rem; color: var(--gold); opacity: .5; }   /* EDIT: .5 = how see-through the A&V crest is */
  .scroll-rule { display: block; width: 210px; height: 24px; margin: 1.2rem auto .8rem; color: var(--gold); }
  .countdown div { position: relative; }
  .countdown div + div::before { content: "✦"; position: absolute; left: -1.45rem; top: .7rem; font-size: .6rem; color: var(--gold-soft); }
  .eyebrow { font-size: .8rem; letter-spacing: .45em; text-transform: uppercase; color: var(--gold); }
  .hero h1 {
    font-family: var(--serif); font-weight: 300; font-size: clamp(3.2rem, 10vw, 7rem);
    line-height: 1; margin: 1.2rem 0;
  }
  .hero h1 em { font-style: italic; color: var(--gold); padding: 0 .15em; }
  .hero .date { font-family: var(--serif); font-size: clamp(2.2rem, 6vw, 3.2rem); font-weight: 400; font-style: italic; line-height: 1.15; margin-top: -.2rem; }
  .hero .place { font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin-top: .5rem; }
  .note { font-family: var(--serif); font-style: italic; font-size: 1.35rem; color: var(--muted); }

  .countdown { display: flex; justify-content: center; gap: 2.4rem; margin-top: 1.8rem; }
  .countdown div { min-width: 60px; }
  .countdown span { display: block; font-family: var(--serif); font-size: 2.6rem; font-weight: 300; line-height: 1; }
  .countdown small { font-size: .65rem; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); }

  .actions { margin-top: 2rem; }
  .btn {
    display: inline-block; padding: .95rem 2.6rem;
    border: 1px solid var(--gold); color: var(--gold); background: transparent;
    font-family: var(--sans); font-size: .72rem; letter-spacing: .3em; text-transform: uppercase;
    text-decoration: none; cursor: pointer; transition: all .25s;
  }
  .btn:hover { background: var(--gold); color: var(--ivory); }
  .cal { margin-top: 1.3rem; font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .cal a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-soft); padding-bottom: 1px; margin: 0 .35rem; cursor: pointer; }
  .cal a:hover { color: var(--ink); }

  /* ---------- Opening: sealed envelope ---------- */
  html.intro-on, html.intro-on body { overflow: hidden; }
  #envIntro {
    position: fixed; top: 0; left: 0; right: 0; height: 100vh; height: 100lvh; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2rem;
  }
  /* linen-textured backdrop with a faint gold botanical pattern */
  #envIntro::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(253,250,244,.85) 0%, rgba(251,248,242,.35) 50%, rgba(232,220,199,.45) 100%),
      repeating-linear-gradient(0deg, rgba(120,95,60,.035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,95,60,.028) 0 1px, transparent 1px 4px),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .37 0 0 0 0 .25 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><g fill='none' stroke='%23b08d57' stroke-opacity='.13' stroke-width='1' stroke-linecap='round'><path d='M40 150 C55 120 70 105 95 92'/><path d='M58 126 q-12 -4 -16 -14 q12 2 16 14Z M70 112 q-2 -12 6 -20 q4 12 -6 20Z M82 101 q-12 -2 -16 -12 q12 0 16 12Z'/><circle cx='97' cy='91' r='3'/><path d='M170 60 C182 80 186 98 182 122'/><path d='M178 78 q10 -6 20 -2 q-8 8 -20 2Z M183 96 q-11 -3 -16 -12 q12 0 16 12Z M184 112 q10 -5 19 0 q-9 7 -19 0Z'/><circle cx='182' cy='124' r='2.4'/><circle cx='130' cy='200' r='2'/><circle cx='138' cy='206' r='1.4'/><circle cx='20' cy='40' r='1.6'/></g></svg>") 0 0 / 240px 240px,
      #f5eee3;
  }
  /* flower arrangements in the corners of the screen */
  .bg-florals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bg-florals > svg { position: absolute; overflow: visible; }
  .bg-rose { position: absolute; display: block; width: min(40vw, 440px); aspect-ratio: 1; }
  .bg-rose.tl { left: max(-50px, -4vw); top: max(-50px, -4vw); }
  .bg-rose.br { right: max(-50px, -4vw); bottom: max(-50px, -4vw); transform: rotate(180deg); }
  .bg-dried { width: min(50vw, 560px); aspect-ratio: 2; filter: drop-shadow(0 3px 4px rgba(90,65,35,.16)); }
  .bg-dried.tr { right: 0; top: 0; transform: translate(50%, -50%) rotate(-45deg) translateX(-14%); }
  .bg-dried.bl { left: 0; bottom: 0; transform: translate(-50%, 50%) rotate(135deg) translateX(-14%); }
  #envIntro.clear::before { opacity: 0; }

  .envelope { position: relative; width: min(560px, 88vw); aspect-ratio: 1.45; perspective: 1400px; margin-top: 3rem; }
  .env-back, .env-pocket, .env-flap { position: absolute; inset: 0; transition: opacity .9s ease, transform 1.1s cubic-bezier(.5,0,.3,1); }
  .env-back { border-radius: 3px; box-shadow: 0 30px 60px -28px rgba(90,65,35,.4), inset 0 0 0 1px rgba(176,141,87,.35);
    /* gold-dotted liner, seen when the flap opens */
    background: radial-gradient(circle, rgba(176,141,87,.38) 1px, transparent 1.6px) 0 0 / 11px 11px,
                radial-gradient(circle, rgba(176,141,87,.2) 1px, transparent 1.6px) 5.5px 5.5px / 11px 11px, #e8dcc6; }
  .env-trim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; color: var(--gold); overflow: visible; }
  .env-trim * { vector-effect: non-scaling-stroke; }
  .env-corner { position: absolute; width: 15%; aspect-ratio: 1; color: var(--gold); pointer-events: none; }
  .env-corner.bl { left: 2.2%; bottom: 3.2%; transform: scaleY(-1); }
  .env-corner.br { right: 2.2%; bottom: 3.2%; transform: scale(-1, -1); }
  /* ---- the save-the-date card (sizes scale with the card: --u = 1% of its width) ---- */
  .env-card {
    position: absolute; left: 6%; right: 6%; top: 8%; bottom: 8%; z-index: 2;
    overflow: visible !important;
    --u: 4.4px; --fit: 1;   /* --u = 1% of the card width, set by the script */
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .37 0 0 0 0 .25 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
      linear-gradient(165deg, #fffdf8, var(--ivory) 55%, #f6efe2);
    border: 1px solid #d3b886; border-radius: 2px; text-align: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 1px 2px rgba(90,65,35,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(.85 * var(--u)); padding-bottom: calc(3 * var(--u));   /* EDIT: 3 = how far the text sits above center */
    transform-origin: center;
    transition: transform 1.1s cubic-bezier(.22,.8,.24,1) .75s, background .9s ease, border-color .9s ease, box-shadow .9s ease;
    overflow: hidden;
  }
  .env-card > * { position: relative; transition: opacity .7s ease; }
  .env-card p { line-height: 1.25; }
  .card-rose { position: absolute !important; width: calc(30 * var(--u)); aspect-ratio: 1; pointer-events: none; z-index: 3;
    opacity: 0; transition: opacity .9s ease .5s !important; }
  .card-rose.tl { left: calc(-7 * var(--u)); top: calc(-7 * var(--u)); }
  .card-rose.br { right: calc(-7 * var(--u)); bottom: calc(-7 * var(--u)); transform: rotate(180deg); }
  .envelope.shown .card-rose { opacity: 1; }
  .rose-corner > svg, .rose-corner > img { width: 100%; height: 100%; display: block; overflow: visible; }
  .seal-roses { position: absolute; z-index: 5; left: 50%; top: 60%; width: 38%; aspect-ratio: 2; pointer-events: none;
    transform: translate(-56%, -60%); transition: opacity .6s ease; }
  .seal-roses > svg, .seal-roses > img { width: 100%; height: 100%; display: block; overflow: visible; }
  .envelope.open .seal-roses { opacity: 0; }
  /* double gold frame */
  .card-frame { position: absolute !important; inset: calc(3.4 * var(--u)); border: 1px solid rgba(176,141,87,.55); pointer-events: none; }
  .card-frame::after { content: ""; position: absolute; inset: calc(1 * var(--u)); border: .5px solid rgba(176,141,87,.35); }
  /* gold corner flourishes */
  .corner { position: absolute !important; width: calc(13 * var(--u)); height: calc(13 * var(--u)); pointer-events: none; color: var(--gold); }
  .corner.tl { left: calc(2.2 * var(--u)); top: calc(2.2 * var(--u)); }
  .corner.tr { right: calc(2.2 * var(--u)); top: calc(2.2 * var(--u)); transform: scaleX(-1); }
  .corner.bl { left: calc(2.2 * var(--u)); bottom: calc(2.2 * var(--u)); transform: scaleY(-1); }
  .corner.br { right: calc(2.2 * var(--u)); bottom: calc(2.2 * var(--u)); transform: scale(-1, -1); }
  /* monogram crest with laurel */
  .crest { width: calc(9 * var(--u) * var(--fit)); height: calc(4.8 * var(--u) * var(--fit)); margin: calc(-.2 * var(--u)) 0 0; color: var(--gold); opacity: .5; }   /* EDIT: .5 = crest see-through */
  .crest text { font-family: var(--serif); font-style: italic; }
  .env-eyebrow { font-family: var(--serif); font-size: calc(max(calc(5.8 * var(--u)), 17px) * var(--fit)); line-height: 1.05; letter-spacing: .26em; text-indent: .26em;
    text-transform: uppercase; color: #a37f46; font-weight: 600; margin-bottom: calc(1.6 * var(--u));
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 2px 5px rgba(150,112,55,.28)); }   /* "Save the Date": big and bold at the top */
  .env-names {
    font-family: var(--serif); font-weight: 300; font-size: calc(6.8 * var(--u) * var(--fit)); line-height: 1.05; color: var(--ink);
    z-index: 2; transform-origin: center; will-change: transform; margin: calc(.3 * var(--u)) 0;
  }
  .env-names em { font-style: italic; color: var(--gold); padding: 0 .15em; }
  .card-rule { display: flex; align-items: center; gap: calc(1.6 * var(--u)); color: var(--gold); font-size: calc(1.8 * var(--u)); }
  .card-rule::before, .card-rule::after { content: ""; width: calc(9 * var(--u)); height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .card-rule::after { transform: scaleX(-1); }
  .env-date { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: calc(4.9 * var(--u) * var(--fit)); color: #6e5538; line-height: 1.15;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 2px 5px rgba(150,112,55,.25)); }
  .env-date sup { font-size: .55em; vertical-align: .7em; margin-left: .05em; color: inherit; }
  .env-venue { max-width: calc(76 * var(--u)); margin-top: calc(.4 * var(--u)); font-size: calc(max(calc(1.65 * var(--u)), 7.5px) * var(--fit)); letter-spacing: .3em; text-indent: .3em; text-transform: uppercase; color: var(--muted); }
  .env-venue i, .hero .place i { font-style: normal; }
  .env-note { font-family: var(--serif); font-style: italic; font-size: calc(max(calc(2.5 * var(--u)), 10px) * var(--fit)); color: var(--muted); margin-top: calc(-.2 * var(--u)); }
  /* add-to-calendar links on the card */
  .card-cal { position: absolute !important; left: calc(16 * var(--u)); right: calc(16 * var(--u)); bottom: calc(5.6 * var(--u)); z-index: 4 !important; font-size: calc(max(calc(1.5 * var(--u)), 8px) * var(--fit));
    letter-spacing: .24em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap;
    justify-content: center; align-items: baseline; gap: .1em .9em; position: relative; z-index: 4; }
  .card-cal span { width: 100%; font-size: .85em; letter-spacing: .3em; opacity: .8; }
  .card-cal a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-soft); padding: .35em 0 .1em; cursor: pointer; font-weight: 400; }
  .card-cal a:hover { color: var(--ink); border-color: var(--gold); }
  .card-cal i { font-style: normal; color: var(--gold-soft); }
  .env-card.narrow .env-venue span { display: block; } .env-card.narrow .env-venue i { display: none; }
  /* gold-foil shimmer that sweeps across once the card is out */
  .env-card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(110deg, transparent 35%, rgba(255,246,222,.75) 50%, transparent 65%) 160% 0 / 250% 100% no-repeat;
    mix-blend-mode: soft-light; opacity: 0;
  }
  .envelope.shown .env-card::after { opacity: 1; animation: cardShine 1.8s ease-in-out .5s 1 forwards; }
  @keyframes cardShine { from { background-position: 160% 0; } to { background-position: -60% 0; } }
  .env-pocket {
    z-index: 3; background: linear-gradient(180deg, #f3ece0, #e8dcc6);
    clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%); border-radius: 3px;
  }
  .env-pocket::after {           /* side seams */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top right, transparent 49.6%, rgba(176,141,87,.22) 50%, transparent 50.4%),
                linear-gradient(to top left, transparent 49.6%, rgba(176,141,87,.22) 50%, transparent 50.4%);
  }
  .env-flap {
    z-index: 4; height: 60%; transform-origin: top center;
    background: linear-gradient(180deg, #e4d6bd, #eee4d2);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transition: transform .8s cubic-bezier(.22,.8,.24,1), z-index 0s .4s, opacity .9s ease;
    filter: drop-shadow(0 4px 6px rgba(90,65,35,.14));
  }
  /* wax seal (drawn in SVG) */
  .seal {
    position: absolute; z-index: 6; left: 50%; top: 60%; transform: translate(-50%, -50%) rotate(-8deg);
    width: 92px; height: 92px; padding: 0; border: none; background: none; cursor: pointer;
    filter: drop-shadow(0 5px 5px rgba(70,48,18,.35)) drop-shadow(0 1px 1px rgba(70,48,18,.4));
    transition: transform .4s ease, opacity .45s ease;
  }
  .seal-svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .seal:hover { transform: translate(-50%, -50%) rotate(-8deg) scale(1.05); }
  .seal:focus-visible { outline: 1px dashed var(--gold); outline-offset: 6px; border-radius: 50%; }

  /* dried flowers tucked under the seal */
  .env-flowers {
    position: absolute; z-index: 5; left: 50%; top: 60%; width: 84%; transform: translate(-50%, -50%) rotate(-4deg);
    pointer-events: none; overflow: visible; filter: drop-shadow(0 2px 2px rgba(90,65,35,.18));
    transition: opacity .6s ease, transform .6s ease;
  }

  /* gentle nudge every 10 seconds until the seal is broken */
  .envelope.nudge { animation: envNudge 1.1s ease-in-out; }
  @keyframes envNudge {
    0%, 100% { transform: none; }
    15% { transform: translateY(-3px) rotate(-1.6deg); }
    32% { transform: translateY(-1px) rotate(1.4deg); }
    50% { transform: rotate(-1deg); }
    68% { transform: rotate(.6deg); }
    84% { transform: rotate(-.3deg); }
  }
  .env-hint { position: relative; font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--muted); transition: opacity .4s ease; }
  .env-skip { z-index: 9; text-shadow: 0 0 6px #fbf8f2, 0 0 2px #fbf8f2; position: absolute; right: 1.4rem; bottom: 1.2rem; background: none; border: 0; font-family: var(--sans); font-size: .66rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); cursor: pointer; transition: opacity .4s ease; }

  /* tapped: seal fades, flap lifts, card slides up */
  .envelope.open .seal { opacity: 0; transform: translate(-50%, -50%) rotate(-8deg) scale(.6); pointer-events: none; }
  .envelope.open .env-flowers { opacity: 0; transform: translate(-50%, -46%) rotate(-4deg) scale(.94); }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 1; }
  .envelope.open .env-card { transform: translateY(-58%); }
  #envIntro.opening .env-hint, #envIntro.opening .env-skip { opacity: 0; pointer-events: none; }
  .finale { position: absolute; left: 0; right: 0; bottom: auto; z-index: 8; text-align: center;
    opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity 1.1s ease, transform 1.1s ease; }
  #envIntro.done .finale { opacity: 1; transform: none; pointer-events: auto; }
  /* the website button: filled gold so it stands out */
  .finale .site-btn {
    padding: 1.15rem 2.6rem; font-size: .82rem; font-weight: 700; letter-spacing: .24em;
    color: #fffaf0; border: 1px solid #a07d43;
    background: linear-gradient(135deg, #c9a466, #b08d57 55%, #9c7a45);
    box-shadow: 0 10px 24px -10px rgba(110,80,35,.55), inset 0 1px 0 rgba(255,255,255,.35);
    text-shadow: 0 1px 1px rgba(80,55,20,.3);
    animation: btnGlow 3.2s ease-in-out 1.5s infinite;
  }
  .finale .site-btn span { display: inline-block; margin-left: .5rem; transition: transform .25s ease; }
  .finale .site-btn:hover { background: linear-gradient(135deg, #b8955a, #9c7a45); color: #fff; }
  .finale .site-btn:hover span { transform: translateX(4px); }
  @keyframes btnGlow { 0%, 100% { box-shadow: 0 10px 24px -10px rgba(110,80,35,.55), inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 0 rgba(176,141,87,.35); }
                       50% { box-shadow: 0 10px 24px -10px rgba(110,80,35,.55), inset 0 1px 0 rgba(255,255,255,.35), 0 0 0 9px rgba(176,141,87,0); } }
  @media (max-width: 760px) { .finale .site-btn { padding: 1.05rem 1.6rem; letter-spacing: .18em; font-size: .76rem; } }
  .finale .cal span { text-shadow: 0 0 8px rgba(251,248,242,.95); }
  /* gentle gold shine across the card lettering every 10 seconds */
  #envIntro.done .env-names, #envIntro.done .env-names em, #envIntro.done .env-date, #envIntro.done .env-eyebrow {
    --c: var(--ink);
    background: linear-gradient(105deg, var(--c) 44%, var(--hi) 50%, var(--c) 56%) 85% 0 / 300% 100% no-repeat;
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
    animation: textShine 10s ease-in-out 1s infinite;   /* EDIT: 10s = time between shines */
  }
  #envIntro.done .env-names { --hi: #b39a75; }
  #envIntro.done .env-date { --c: #6e5538; --hi: #a88a5e; }                      /* EDIT: shine color (closer to the text = subtler) */
  #envIntro.done .env-names em { --c: var(--gold); --hi: #d9c095; }
  #envIntro.done .env-eyebrow { --c: #a37f46; --hi: #d9c095; }
  #envIntro.done .env-eyebrow { animation-delay: .8s; }
  #envIntro.done .env-date { animation-delay: 1.25s; }
  /* then everything but the names melts away */
  #envIntro.leaving .env-back, #envIntro.leaving .env-pocket, #envIntro.leaving .env-flap,
  #envIntro.leaving .env-card > *:not(.env-names) { opacity: 0; }
  #envIntro.leaving .env-card { background: transparent; border-color: transparent; box-shadow: none; overflow: visible; }
  /* the card pulls all the way out, then settles in front as the envelope drops away */
  .envelope.out .env-card { transform: translateY(-122%); transition: transform .75s cubic-bezier(.45,0,.3,1); }
  .envelope.shown .env-card { z-index: 7; overflow: visible;
    transition: transform 1.15s cubic-bezier(.3,.7,.2,1), background .9s ease, border-color .9s ease, box-shadow .9s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 2px 3px rgba(90,65,35,.1), 0 30px 60px -30px rgba(90,65,35,.45); }
  .envelope.shown .env-back, .envelope.shown .env-pocket { transform: translateY(45%); opacity: 0; }
  .envelope.shown .env-flap { opacity: 0; }

  /* After the envelope: the names glide into place as the title, the rest fades in around them */
  html.intro-title .hero h1 { opacity: 0; }
  .hero .eyebrow, .hero .date, .hero .place, .hero .divider, .hero .note, .hero .countdown, .hero .actions, .frame, .page-crest, .page-flowers { transition: opacity 1.3s ease, transform 1.3s cubic-bezier(.2,.7,.2,1); }
  html.intro-hero .hero .eyebrow, html.intro-hero .hero .date, html.intro-hero .hero .place, html.intro-hero .hero .divider,
  html.intro-hero .hero .note, html.intro-hero .hero .countdown, html.intro-hero .hero .actions { opacity: 0; transform: translateY(14px); }
  html.intro-hero .frame, html.intro-hero .page-crest, html.intro-hero .page-flowers { opacity: 0; }
  .page-flowers { transition-delay: .9s; }
  .hero .date { transition-delay: .15s; }
  .hero .place { transition-delay: .3s; }
  .hero .divider, .hero .note { transition-delay: .45s; }
  .hero .countdown { transition-delay: .6s; }
  .hero .actions { transition-delay: .75s; }
  .frame { transition-delay: .3s; }

  @media (max-width: 760px) {
    .countdown { gap: 1.2rem; }
    .countdown div + div::before { left: -.95rem; }
    .page-flowers { width: 170px; height: 85px; }
    .page-flowers.tl { left: 6px; top: 40px; }
    .page-flowers.br { right: 6px; bottom: 40px; }
    .page-crest { width: 92px; height: 50px; margin-bottom: .6rem; }
    .frame .edge { width: 90px; height: 22px; margin-left: -45px; }
    .frame .edge.top { top: 11px; } .frame .edge.bottom { bottom: 11px; }
    .frame { inset: 10px; }
    .hero .place span { display: block; } .hero .place i { display: none; }
    .frame .corner { width: 58px; height: 58px; left: auto; }
    .frame .corner.tl, .frame .corner.bl { left: -5px; }
    .frame .corner.tl, .frame .corner.tr { top: -5px; }
    .frame .corner.tr, .frame .corner.br { right: -5px; }
    .frame .corner.bl, .frame .corner.br { bottom: -5px; }
    .seal { width: 76px; height: 76px; }
    .btn { padding: .95rem 1.6rem; letter-spacing: .22em; }
    .cal span { display: block; margin-bottom: .3rem; }
    .cal a { white-space: nowrap; }
  }

/* Paper roses with eucalyptus and baby's breath, drawn in SVG (from the bride's design) */
(function () {
  // ---------- Florals (drawn in SVG) ----------
  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function jit(v, amt) { return v * (1 + (rnd() - .5) * amt); }

  function rot(x, y, a) { var c = Math.cos(a), sn = Math.sin(a); return f(x * c - y * sn) + ' ' + f(x * sn + y * c); }

    var a = deg * Math.PI / 180, t = (rnd() - .5) * .24, n = (rnd() - .5) * .14, k = .9 + rnd() * .2;

    var veins = '';
    [-.4, -.12, .15, .42].forEach(function (v) {
      veins += 'M' + P(w * v * .15, -l * .14) + ' Q' + P(w * v * .75, -l * .5) + ' ' + P(w * v * 1.15, -l * .82);
    });
    return '<path d="' + d + '" fill="url(#' + fill + ')" stroke="' + edge + '" stroke-width=".5" vector-effect="non-scaling-stroke"/>' +

        '<ellipse rx="' + f(sz) + '" ry="' + f(sz * .82) + '" fill="url(#euc)" stroke="rgba(110,90,60,.3)" stroke-width=".4"/>' +

  }
  function bud(x, y, r, ang, tone) {

    var d = 'M0 0 C' + f(r * .9) + ' ' + f(-r * .4) + ' ' + f(r * .8) + ' ' + f(-r * 1.4) + ' 0 ' + f(-r * 1.9) + ' C' + f(-r * .8) + ' ' + f(-r * 1.4) + ' ' + f(-r * .9) + ' ' + f(-r * .4) + ' 0 0Z';
    return '<g transform="translate(' + x + ' ' + y + ') rotate(' + ang + ')" filter="url(#lift)">' +
      '<path d="M0 0 L0 ' + f(r * 2.2) + '" stroke="#a8977a" stroke-width=".9"/>' +
      '<path d="' + d + '" fill="url(#' + fill + ')" stroke="rgba(127,100,72,.35)" stroke-width=".45"/>' +
      '<path d="' + d + '" fill="url(#shade)"/>' +
      '<path d="M0 ' + f(-r * 1.85) + ' Q' + f(r * .3) + ' ' + f(-r) + ' ' + f(r * .55) + ' ' + f(-r * .3) + '" stroke="rgba(127,100,72,.3)" stroke-width=".45" fill="none"/>' +

  }

    var s = '<path d="M' + x1 + ' ' + y1 + ' Q' + ((x1 + x2) / 2 + 6) + ' ' + ((y1 + y2) / 2 - 6) + ' ' + x2 + ' ' + y2 + '" stroke="#b3a283" stroke-width=".6" fill="none"/>';

        '<circle cx="' + cx + '" cy="' + cy + '" r="' + p[2] + '" fill="url(#breath)"/>' +

      leaf(46, 22, 56, 12, 84) + leaf(58, 34, 42, 10, 116) + leaf(22, 46, 56, 12, 168) + leaf(34, 58, 42, 10, 138) +
      breath(66, 24, 128, 14) + breath(24, 66, 14, 128) +

<script>
/* Guests tap the wax seal: the flap lifts, petals burst out, and the card comes
   out of the envelope and stays in front, with the website and calendar links below. */
(function () {
  const intro = document.getElementById('envIntro');
  if (!intro) return;
  const root = document.documentElement;
  root.classList.add('intro-on', 'intro-hero', 'intro-title');
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  const envelope = document.getElementById('envelope');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;


  // gentle shake every 10 seconds until the seal is broken
  const NUDGE_EVERY = 4.5;             // EDIT: seconds between shakes
  const nudge = reduce ? null : setInterval(() => {
    envelope.classList.remove('nudge'); void envelope.offsetWidth;   // restart the animation
    envelope.classList.add('nudge');
  }, NUDGE_EVERY * 1000);
  envelope.addEventListener('animationend', () => envelope.classList.remove('nudge'));

  // flower petals bursting out of the envelope, then floating down
  const PETALS = 90;                  // EDIT: how many petals
  const PETAL_FALL = 1;               // EDIT: falling speed (1 = normal, 1.5 = faster, .7 = slower)
  const PETAL_COLORS = [              // EDIT: [base, tip] colors — white, champagne, palest rose
    ['#efe6d6', '#fffdf9'], ['#f1e9db', '#ffffff'], ['#e6d2ae', '#f8eedb'],
    ['#dcc39b', '#f3e5c9'], ['#f0d9d2', '#fdf3f0'], ['#ecd3cb', '#fbefeb']
  ];
  function petalSprite([base, tip]) {           // draw one petal once, reuse it for every copy
    const c = document.createElement('canvas'), w = 44, h = 54; c.width = w; c.height = h;
    const g = c.getContext('2d'), grad = g.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, base); grad.addColorStop(.7, tip); grad.addColorStop(1, tip);
    g.translate(w / 2, h - 3);
    g.beginPath();                                 // rounded rose petal with a soft notch at the top
    g.moveTo(0, 0);
    g.bezierCurveTo(14, -6, 21, -26, 17, -40);
    g.bezierCurveTo(14, -48, 5, -50, 0, -45);
    g.bezierCurveTo(-5, -50, -14, -48, -17, -40);
    g.bezierCurveTo(-21, -26, -14, -6, 0, 0);
    g.fillStyle = grad; g.fill();
    g.strokeStyle = 'rgba(176,141,87,.18)'; g.lineWidth = .8; g.stroke();
    g.beginPath(); g.moveTo(0, -4); g.quadraticCurveTo(2, -22, 0, -38);   // faint center vein
    g.strokeStyle = 'rgba(176,141,87,.12)'; g.lineWidth = .9; g.stroke();
    g.beginPath(); g.moveTo(-12, -38); g.quadraticCurveTo(-6, -46, 0, -42); // light catching the edge
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.2; g.stroke();
    return c;
  }
  function petals() {
    if (reduce) return;
    const cv = document.createElement('canvas');
    cv.setAttribute('aria-hidden', 'true');
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10000';
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
    const W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
    const sprites = PETAL_COLORS.map(petalSprite);
    const k = Math.max(1, H / 844);                       // bigger burst on bigger screens
    const r = envelope.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height * .3;
    const list = Array.from({ length: PETALS }, (_, i) => {
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.1, v = (11 + Math.random() * 15) * k;
      return {
        x: ox + (Math.random() - .5) * r.width * .55, y: oy + Math.random() * 10,
        vx: Math.cos(a) * v * 1.15, vy: Math.sin(a) * v,
        size: (12 + Math.random() * 12) * Math.max(1, Math.min(W, H) / 760),
        rot: Math.random() * 6.3, spin: (Math.random() - .5) * .12,
        flip: Math.random() * 6.3, flipSpeed: .04 + Math.random() * .07,
        sway: .5 + Math.random() * 1.2, swayPh: Math.random() * 6.3,
        fall: (1.9 + Math.random() * 1.6) * k * PETAL_FALL,   // how fast it drifts down once slowed

  const card = document.getElementById('envCard');

  // size the card's lettering to the card, then shrink it a little if anything would spill over the frame
  function fitCard() {
    const w = card.offsetWidth;
    card.style.setProperty('--u', (w / 100) + 'px');
    card.classList.toggle('narrow', w < 420);
    let fit = 1; card.style.setProperty('--fit', fit);
    const frame = card.querySelector('.card-frame').getBoundingClientRect();
    const parts = [...card.querySelectorAll('.crest, .env-eyebrow, .env-names, .card-rule, .env-date, .env-venue, .env-note, .card-cal')];
    for (let i = 0; i < 12; i++) {
      const k = card.getBoundingClientRect().width / w;               // undo the card's own scaling
      const pad = 6 * k;
      const over = parts.some(el => {
        const r = document.createRange(); r.selectNodeContents(el); const b = el.tagName === 'svg' ? el.getBoundingClientRect() : r.getBoundingClientRect();
        return b.left < frame.left + pad || b.right > frame.right - pad || b.top < frame.top + pad || b.bottom > frame.bottom - pad;
      });
      if (!over) break;
      fit -= .06; card.style.setProperty('--fit', fit.toFixed(2));
    }
  }
  fitCard();
  // re-fit once the real fonts arrive (but never mid-animation)
  if (document.fonts) document.fonts.ready.then(function refit() {
    if (opened && !intro.classList.contains('done')) return setTimeout(refit, 400);
    fitCard();
  });
  let cardScale = 1;
  function present() {
    const er = envelope.getBoundingClientRect();
    const cw = card.offsetWidth, ch = card.offsetHeight;
    const finale = intro.querySelector('.finale'), fh = finale.offsetHeight, gap = 34;
    const H = Math.min(intro.clientHeight, innerHeight);
    cardScale = Math.min(innerWidth * .86 / cw, 820 / cw, (H - fh - gap - 70) / ch);   // EDIT: 820 = largest card width (px)
    const h = ch * cardScale, top = Math.max(24, (H - (h + gap + fh)) / 2);  // card + links centered as a group
    const cx = er.left + card.offsetLeft + cw / 2, cy = er.top + card.offsetTop + ch / 2;
    envelope.classList.add('shown');
    card.style.willChange = 'transform';                           // smooth while it moves…
    card.style.transform = `translate(${innerWidth / 2 - cx}px, ${top + h / 2 - cy}px) scale(${cardScale})`;
    clearTimeout(present.t); present.t = setTimeout(() => card.style.willChange = 'auto', 1300);   // …then crisp once it lands

  }

  // (only when the width changes, e.g. turning the phone; a phone's address bar showing/hiding is ignored)
  let lastW = innerWidth, rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      if (innerWidth === lastW) return;
      lastW = innerWidth; fitCard();
      if (!envelope.classList.contains('shown')) return;
      card.style.transition = 'none'; card.style.transform = ''; present();
      requestAnimationFrame(() => requestAnimationFrame(() => card.style.transition = ''));

    if (opened) return; opened = true;
    clearInterval(nudge); envelope.classList.remove('nudge');
    intro.style.height = intro.clientHeight + 'px';                 // lock the layout so nothing re-centers mid-animation
    intro.classList.add('opening');
    envelope.classList.add('open');                               // seal fades, flap lifts, card rises
    setTimeout(petals, fast ? 400 : 650);                         // petals burst out as the flap opens
    if (reduce) { envelope.classList.add('out'); present(); intro.classList.add('done'); return; }
    setTimeout(() => envelope.classList.add('out'), fast ? 1200 : 1900);   // card pulls all the way out
    setTimeout(present, fast ? 1700 : 2550);                                // …and settles in front
    setTimeout(() => intro.classList.add('done'), fast ? 2600 : 3500);      // website + calendar links fade in below
  }

  document.getElementById('seal').addEventListener('click', () => open(false));
  document.getElementById('envSkip').addEventListener('click', () => open(true));
})();
</script>

  };
  const utc = t => new Date(t).toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';   // e.g. 20270902T210000Z
  document.getElementById('calGoogle').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(EVENT.title) + '&dates=' + utc(EVENT.start) + '/' + utc(EVENT.end)
    + '&ctz=America/New_York&location=' + encodeURIComponent(EVENT.place) + '&details=' + encodeURIComponent(EVENT.details);
  // Apple Calendar / Outlook: downloads a calendar file
  document.getElementById('calIcs').addEventListener('click', e => {
    e.preventDefault();
    const esc = t => t.replace(/([,;\\])/g, '\\$1');
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Alexa & Vincent//Save the Date//EN', 'BEGIN:VEVENT',
      'UID:alexa-vincent-20270902@wedding', 'DTSTAMP:' + utc(Date.now()),
      'DTSTART:' + utc(EVENT.start), 'DTEND:' + utc(EVENT.end),
      'SUMMARY:' + esc(EVENT.title), 'LOCATION:' + esc(EVENT.place), 'DESCRIPTION:' + esc(EVENT.details),
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = 'alexa-vincent-wedding.ics';
    document.body.appendChild(a); a.click(); a.remove();
  });
